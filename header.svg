<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 320" width="100%" height="320">
  <defs>
    <style>
      @keyframes flow { 0% { stroke-dashoffset: 1000; } 100% { stroke-dashoffset: 0; } }
      @keyframes pulse { 0%, 100% { r: 2; opacity: 0.3; } 50% { r: 5; opacity: 1; } }
      @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }
      @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 4px rgba(0,229,255,0.3)); } 50% { filter: drop-shadow(0 0 20px rgba(0,229,255,0.9)); } }
      @keyframes shimmer { 0% { transform: translateX(-1280px); } 100% { transform: translateX(1280px); } }
      .flow { animation: flow 4s linear infinite; }
      .pulse { animation: pulse 2.5s ease-in-out infinite; }
      .rotate { animation: rotate 8s linear infinite; }
      .float { animation: float 4s ease-in-out infinite; }
      .glow { animation: glow 3s ease-in-out infinite; }
      .shimmer { animation: shimmer 3s linear infinite; }
    </style>
    
    <defs>
      <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
        <stop offset="20%" style="stop-color:#001d3d;stop-opacity:1" />
        <stop offset="40%" style="stop-color:#003d5c;stop-opacity:1" />
        <stop offset="60%" style="stop-color:#00e5ff;stop-opacity:0.08" />
        <stop offset="100%" style="stop-color:#0078d4;stop-opacity:0.05" />
      </linearGradient>
      
      <radialGradient id="nodeGrad" cx="30%" cy="30%">
        <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#0078d4;stop-opacity:0.2" />
      </radialGradient>
      
      <pattern id="grid" x="40" y="40" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,229,255,0.04)" stroke-width="1"/>
        <circle cx="40" cy="40" r="0.5" fill="rgba(0,229,255,0.1)"/>
      </pattern>
      
      <filter id="glow">
        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    
    <!-- Sophisticated clip path -->
    <clipPath id="textClip">
      <rect width="1280" height="320"/>
    </clipPath>
  </defs>
  
  <!-- Background layers -->
  <rect width="1280" height="320" fill="url(#mainGrad)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  
  <!-- Mathematical visualization - Fibonacci spiral background -->
  <g opacity="0.08">
    <path d="M 640 160 Q 540 160, 540 260 Q 540 360, 640 360 Q 790 360, 790 210 Q 790 35, 590 35 Q 340 35, 340 285 Q 340 535, 640 535" 
          fill="none" stroke="#00e5ff" stroke-width="1"/>
  </g>
  
  <!-- Animated neural network nodes -->
  <g id="network">
    <!-- Layer 1: Input neurons -->
    <circle cx="150" cy="60" r="3" class="pulse" fill="url(#nodeGrad)" filter="url(#glow)"/>
    <circle cx="200" cy="120" r="3" class="pulse" fill="url(#nodeGrad)" filter="url(#glow)" style="animation-delay: 0.2s"/>
    <circle cx="180" cy="220" r="3" class="pulse" fill="url(#nodeGrad)" filter="url(#glow)" style="animation-delay: 0.4s"/>
    <circle cx="150" cy="280" r="3" class="pulse" fill="url(#nodeGrad)" filter="url(#glow)" style="animation-delay: 0.6s"/>
    
    <!-- Layer 2: Hidden neurons -->
    <circle cx="400" cy="80" r="3" class="pulse" fill="url(#nodeGrad)" filter="url(#glow)" style="animation-delay: 0.1s"/>
    <circle cx="420" cy="160" r="3" class="pulse" fill="url(#nodeGrad)" filter="url(#glow)" style="animation-delay: 0.3s"/>
    <circle cx="400" cy="240" r="3" class="pulse" fill="url(#nodeGrad)" filter="url(#glow)" style="animation-delay: 0.5s"/>
    
    <!-- Layer 3: Output neurons -->
    <circle cx="650" cy="100" r="3" class="pulse" fill="url(#nodeGrad)" filter="url(#glow)" style="animation-delay: 0.2s"/>
    <circle cx="680" cy="200" r="3" class="pulse" fill="url(#nodeGrad)" filter="url(#glow)" style="animation-delay: 0.4s"/>
    
    <!-- Synaptic connections with animated flow -->
    <g stroke="#00e5ff" stroke-width="1.5" opacity="0.3" class="flow" stroke-dasharray="1000">
      <line x1="150" y1="60" x2="400" y2="80"/>
      <line x1="200" y1="120" x2="420" y2="160"/>
      <line x1="180" y1="220" x2="400" y2="240"/>
      <line x1="150" y1="280" x2="420" y2="160"/>
      <line x1="400" y1="80" x2="650" y2="100"/>
      <line x1="420" y1="160" x2="680" y2="200"/>
      <line x1="400" y1="240" x2="650" y2="100"/>
    </g>
  </g>
  
  <!-- Central title section -->
  <g>
    <!-- Decorative rotating circles (mathematics) -->
    <circle cx="640" cy="90" r="70" fill="none" stroke="#00e5ff" stroke-width="0.5" opacity="0.3" class="rotate"/>
    <circle cx="640" cy="90" r="60" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.4" class="rotate" style="animation-direction: reverse; animation-duration: 12s;"/>
    <circle cx="640" cy="90" r="50" fill="none" stroke="#0078d4" stroke-width="0.5" opacity="0.2" class="rotate" style="animation-duration: 16s;"/>
    
    <!-- Animated data particles -->
    <circle r="1.5" fill="#00e5ff" opacity="0.8">
      <animateMotion dur="8s" repeatCount="indefinite">
        <mpath xlink:href="#network"/>
      </animateMotion>
    </circle>
    
    <!-- Main typography -->
    <text x="640" y="110" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="52" font-weight="900" fill="#00e5ff" text-anchor="middle" letter-spacing="3" class="glow">
      MAHINDRA GUPTHA KOTHA
    </text>
    
    <!-- Subtitle with styling -->
    <text x="640" y="150" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="14" fill="#8b949e" text-anchor="middle" letter-spacing="1">
      AI/ML Engineer | Cloud Architect | Production Systems
    </text>
    
    <!-- Animated underline -->
    <line x1="380" y1="165" x2="900" y2="165" stroke="#00e5ff" stroke-width="1.5" opacity="0.6" class="glow"/>
    
    <!-- Mathematical formula decoration -->
    <text x="640" y="195" font-family="'IBM Plex Mono', monospace" font-size="11" fill="rgba(0,229,255,0.4)" text-anchor="middle">
      ∑ Skills ∝ ∫ Experience × Expertise
    </text>
  </g>
  
  <!-- Skill visualization with polar coordinates -->
  <g>
    <!-- AI/ML: 99% -->
    <g transform="translate(150, 260)" class="float" style="animation-delay: 0s">
      <circle cx="0" cy="0" r="18" fill="none" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="113 127" stroke-dashoffset="0" class="glow"/>
      <text x="0" y="4" font-family="monospace" font-size="12" fill="#00e5ff" text-anchor="middle" font-weight="bold">99%</text>
      <text x="0" y="-28" font-family="monospace" font-size="10" fill="#00e5ff" text-anchor="middle">AI/ML</text>
    </g>
    
    <!-- Cloud: 95% -->
    <g transform="translate(420, 260)" class="float" style="animation-delay: 0.5s">
      <circle cx="0" cy="0" r="18" fill="none" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="107 127" stroke-dashoffset="0" class="glow"/>
      <text x="0" y="4" font-family="monospace" font-size="12" fill="#00e5ff" text-anchor="middle" font-weight="bold">95%</text>
      <text x="0" y="-28" font-family="monospace" font-size="10" fill="#00e5ff" text-anchor="middle">Cloud</text>
    </g>
    
    <!-- Full-Stack: 92% -->
    <g transform="translate(690, 260)" class="float" style="animation-delay: 1s">
      <circle cx="0" cy="0" r="18" fill="none" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="104 127" stroke-dashoffset="0" class="glow"/>
      <text x="0" y="4" font-family="monospace" font-size="12" fill="#00e5ff" text-anchor="middle" font-weight="bold">92%</text>
      <text x="0" y="-28" font-family="monospace" font-size="10" fill="#00e5ff" text-anchor="middle">Full-Stack</text>
    </g>
    
    <!-- DevOps: 91% -->
    <g transform="translate(960, 260)" class="float" style="animation-delay: 1.5s">
      <circle cx="0" cy="0" r="18" fill="none" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="103 127" stroke-dashoffset="0" class="glow"/>
      <text x="0" y="4" font-family="monospace" font-size="12" fill="#00e5ff" text-anchor="middle" font-weight="bold">91%</text>
      <text x="0" y="-28" font-family="monospace" font-size="10" fill="#00e5ff" text-anchor="middle">DevOps</text>
    </g>
    
    <!-- Design: 88% -->
    <g transform="translate(1130, 260)" class="float" style="animation-delay: 2s">
      <circle cx="0" cy="0" r="18" fill="none" stroke="rgba(0,229,255,0.2)" stroke-width="1"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="99.5 127" stroke-dashoffset="0" class="glow"/>
      <text x="0" y="4" font-family="monospace" font-size="12" fill="#00e5ff" text-anchor="middle" font-weight="bold">88%</text>
      <text x="0" y="-28" font-family="monospace" font-size="10" fill="#00e5ff" text-anchor="middle">Design</text>
    </g>
  </g>
  
  <!-- Corner HUD elements -->
  <g opacity="0.5">
    <rect x="15" y="15" width="35" height="35" fill="none" stroke="#00e5ff" stroke-width="1"/>
    <line x1="20" y1="20" x2="30" y2="20" stroke="#00e5ff" stroke-width="1"/>
    <line x1="20" y1="25" x2="30" y2="25" stroke="#00e5ff" stroke-width="1"/>
    <line x1="20" y1="30" x2="30" y2="30" stroke="#00e5ff" stroke-width="1"/>
    
    <rect x="1230" y="15" width="35" height="35" fill="none" stroke="#00e5ff" stroke-width="1"/>
    <line x1="1235" y1="20" x2="1250" y2="20" stroke="#00e5ff" stroke-width="1"/>
    <line x1="1235" y1="25" x2="1250" y2="25" stroke="#00e5ff" stroke-width="1"/>
    <line x1="1235" y1="30" x2="1250" y2="30" stroke="#00e5ff" stroke-width="1"/>
  </g>
  
  <!-- Shimmer effect -->
  <rect x="0" y="0" width="1280" height="320" fill="url(#mainGrad)" opacity="0.02" class="shimmer"/>
</svg>