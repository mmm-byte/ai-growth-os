<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="400">
  <defs>
    <style>
      @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
      @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .rotate { animation: rotate 20s linear infinite; transform-origin: 500px 200px; }
    </style>
    
    <linearGradient id="skillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0078d4;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  
  <rect width="1000" height="400" fill="#0f172a"/>
  
  <!-- Central hexagon (represents core skills) -->
  <g class="rotate">
    <polygon points="500,50 750,125 750,275 500,350 250,275 250,125" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.4"/>
    <polygon points="500,100 700,160 700,260 500,310 300,260 300,160" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.2"/>
  </g>
  
  <!-- Skill nodes around hexagon (polar distribution) -->
  <g>
    <!-- Node 1: AI/ML -->
    <circle cx="750" cy="125" r="25" fill="url(#skillGrad)" opacity="0.8" class="pulse"/>
    <text x="750" y="130" font-family="monospace" font-size="14" font-weight="bold" fill="white" text-anchor="middle">AI/ML</text>
    
    <!-- Node 2: Cloud Arch -->
    <circle cx="750" cy="275" r="25" fill="url(#skillGrad)" opacity="0.8" class="pulse" style="animation-delay: 0.2s"/>
    <text x="750" y="280" font-family="monospace" font-size="12" fill="white" text-anchor="middle">Cloud</text>
    
    <!-- Node 3: Full-Stack -->
    <circle cx="500" cy="350" r="25" fill="url(#skillGrad)" opacity="0.8" class="pulse" style="animation-delay: 0.4s"/>
    <text x="500" y="355" font-family="monospace" font-size="11" fill="white" text-anchor="middle">Full-Stack</text>
    
    <!-- Node 4: DevOps -->
    <circle cx="250" cy="275" r="25" fill="url(#skillGrad)" opacity="0.8" class="pulse" style="animation-delay: 0.6s"/>
    <text x="250" y="280" font-family="monospace" font-size="12" fill="white" text-anchor="middle">DevOps</text>
    
    <!-- Node 5: Research -->
    <circle cx="250" cy="125" r="25" fill="url(#skillGrad)" opacity="0.8" class="pulse" style="animation-delay: 0.8s"/>
    <text x="250" y="130" font-family="monospace" font-size="11" fill="white" text-anchor="middle">Research</text>
    
    <!-- Node 6: Design -->
    <circle cx="500" cy="50" r="25" fill="url(#skillGrad)" opacity="0.8" class="pulse" style="animation-delay: 1s"/>
    <text x="500" y="55" font-family="monospace" font-size="12" fill="white" text-anchor="middle">Design</text>
  </g>
  
  <!-- Central core -->
  <circle cx="500" cy="200" r="40" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.6" class="pulse"/>
  <circle cx="500" cy="200" r="30" fill="#00e5ff" opacity="0.1"/>
  <text x="500" y="210" font-family="monospace" font-size="16" font-weight="bold" fill="#00e5ff" text-anchor="middle">TOP 1%</text>
  
  <!-- Connecting lines to nodes -->
  <g stroke="#00e5ff" stroke-width="1" opacity="0.3">
    <line x1="500" y1="200" x2="750" y2="125"/>
    <line x1="500" y1="200" x2="750" y2="275"/>
    <line x1="500" y1="200" x2="500" y2="350"/>
    <line x1="500" y1="200" x2="250" y2="275"/>
    <line x1="500" y1="200" x2="250" y2="125"/>
    <line x1="500" y1="200" x2="500" y2="50"/>
  </g>
</svg>