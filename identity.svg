<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="450">
  <defs>
    <style>
      .bg { fill: #020617; }
      .grid { fill: none; stroke: #1e293b; stroke-width: 0.5; }
      .frame { fill: #050914; stroke: #00E5FF; stroke-width: 1; opacity: 0.8; }
      .accent-line { stroke: #7000FF; stroke-width: 2; }
      
      /* Typography */
      .sys-text { font-family: "Fira Code", monospace; font-size: 10px; fill: #475569; letter-spacing: 2px; }
      .sys-cyan { fill: #00E5FF; }
      .sys-pink { fill: #f472b6; }
      
      .code-font { font-family: "Fira Code", "JetBrains Mono", Consolas, monospace; font-size: 14px; }
      .line-num { fill: #334155; font-size: 12px; }
      .keyword { fill: #c084fc; font-weight: bold; } /* Purple */
      .variable { fill: #e2e8f0; } /* White */
      .string { fill: #00E5FF; } /* Cyan */
      .operator { fill: #f472b6; } /* Pink */
      .comment { fill: #64748b; font-style: italic; } /* Slate */
      .property { fill: #38bdf8; } /* Light Blue */

      /* Animations */
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { fill: #00E5FF; animation: blink 1s step-end infinite; }
      
      @keyframes scanline {
        0% { transform: translateY(0); opacity: 0; }
        10% { opacity: 0.5; }
        90% { opacity: 0.5; }
        100% { transform: translateY(450px); opacity: 0; }
      }
      .scanner { fill: url(#scan-grad); animation: scanline 6s linear infinite; pointer-events: none; }
      
      @keyframes memory-hash {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
      .hash { animation: memory-hash 3s infinite alternate; }
    </style>

    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" class="grid" />
    </pattern>
  </defs>

  <!-- Base Layer -->
  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" fill="url(#smallGrid)" opacity="0.3" />

  <!-- Main Container -->
  <g transform="translate(20, 20)">
    <!-- Outer Brutalist Frame -->
    <rect x="0" y="0" width="860" height="410" class="frame" rx="4" />
    
    <!-- Top Telemetry Bar -->
    <rect x="0" y="0" width="860" height="30" fill="#0f172a" rx="4" />
    <line x1="0" y1="30" x2="860" y2="30" stroke="#1e293b" stroke-width="2" />
    <line x1="0" y1="30" x2="150" y2="30" class="accent-line" />
    
    <text x="15" y="19" class="sys-text">SYS.INIT // <tspan class="sys-cyan">IDENTITY_PAYLOAD.ts</tspan></text>
    <text x="700" y="19" class="sys-text">MEM: <tspan class="sys-pink">0x7F8A9B</tspan> | LATENCY: 12ms</text>

    <!-- Line Numbers Gutter -->
    <rect x="0" y="31" width="40" height="379" fill="#020617" opacity="0.8" rx="4" />
    <line x1="40" y1="31" x2="40" y2="410" stroke="#1e293b" stroke-width="1" />
    
    <g class="code-font line-num" text-anchor="end">
      <text x="32" y="70">01</text>
      <text x="32" y="95">02</text>
      <text x="32" y="120">03</text>
      <text x="32" y="145">04</text>
      <text x="32" y="170">05</text>
      <text x="32" y="195">06</text>
      <text x="32" y="220">07</text>
      <text x="32" y="245">08</text>
      <text x="32" y="270">09</text>
      <text x="32" y="295">10</text>
      <text x="32" y="320">11</text>
      <text x="32" y="345">12</text>
      <text x="32" y="370">13</text>
    </g>

    <!-- === THE PAYLOAD (CODE) === -->
    <g transform="translate(60, 70)" class="code-font">
      <!-- 01 -->
      <text y="0">
        <tspan class="keyword">const</tspan> <tspan class="variable">IDENTITY</tspan> <tspan class="operator">=</tspan> <tspan class="variable">{</tspan>
      </text>

      <!-- 02 -->
      <text y="25">
        <tspan class="property">  role</tspan><tspan class="operator">:</tspan> <tspan class="string">"AI, ML and Full stack Engineer"</tspan><tspan class="variable">,</tspan>
      </text>

      <!-- 03 -->
      <text y="50">
        <tspan class="property">  location</tspan><tspan class="operator">:</tspan> <tspan class="string">"Dallas, TX [NODE_01]"</tspan><tspan class="variable">,</tspan>
      </text>

      <!-- 04 -->
      <text y="75" class="comment">  // Core Research & Architectural Focus</text>

      <!-- 05 -->
      <text y="100">
        <tspan class="property">  focus_areas</tspan><tspan class="operator">:</tspan> <tspan class="variable">[</tspan>
      </text>

      <!-- 06, 07, 08 -->
      <text y="125" class="string">    "Multi-Model LLM Consensus Systems"<tspan class="variable">,</tspan></text>
      <text y="150" class="string">    "Medical AI Benchmarking & QA Evaluation"<tspan class="variable">,</tspan></text>
      <text y="175" class="string">    "AI-Driven System Security (SENTINEL Suite)"</text>
      
      <!-- 09 -->
      <text y="200" class="variable">  ],</text>

      <!-- 10 -->
      <text y="225" class="comment">  /* Active Infrastructure & Deployments */</text>

      <!-- 11 -->
      <text y="250">
        <tspan class="property">  currently_building</tspan><tspan class="operator">:</tspan> <tspan class="variable">{</tspan>
      </text>

      <!-- 12 -->
      <text y="275">
        <tspan class="property">    eval_engine</tspan><tspan class="operator">:</tspan> <tspan class="string">"Multi-LLM Medical AI Judge"</tspan><tspan class="variable">,</tspan>
      </text>
      
      <!-- 13 -->
      <text y="300">
        <tspan class="property">    security_ui</tspan><tspan class="operator">:</tspan> <tspan class="string">"SENTINEL Modular Detection Pipeline"</tspan>
      </text>

      <!-- 14 -->
      <text y="325" class="variable">  }</text>

      <!-- 15 -->
      <text y="350" class="variable">};</text>

      <!-- Pulsing Cursor -->
      <rect x="22" y="337" width="10" height="16" class="cursor" />
    </g>

    <!-- Right Side Data Hashes (Decorative Tech Elements) -->
    <g class="sys-text hash" text-anchor="end" transform="translate(840, 70)">
      <text y="0">[0x00A1]</text>
      <text y="75" class="sys-cyan">[0x00F8]</text>
      <text y="125">[0x01B2]</text>
      <text y="250" class="sys-pink">[0x02C4]</text>
      <text y="300">[0x03FF]</text>
    </g>
    
    <!-- Decorative Corner Brackets -->
    <path d="M -5 10 L -5 -5 L 10 -5" fill="none" stroke="#00E5FF" stroke-width="2" />
    <path d="M 865 10 L 865 -5 L 850 -5" fill="none" stroke="#00E5FF" stroke-width="2" />
    <path d="M -5 400 L -5 415 L 10 415" fill="none" stroke="#00E5FF" stroke-width="2" />
    <path d="M 865 400 L 865 415 L 850 415" fill="none" stroke="#00E5FF" stroke-width="2" />
  </g>

  <!-- Hardware Scanline overlay -->
  <rect width="100%" height="80" class="scanner" />
</svg>
