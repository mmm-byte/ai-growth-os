<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" role="img" aria-labelledby="title desc">
<title id="title">An end-to-end engineering path</title>
<desc id="desc">A connected path from AI and data through evaluation and full-stack products to cloud delivery.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset=".55" stop-color="#151A30"/><stop offset="1" stop-color="#101827"/></linearGradient>
  <linearGradient id="path" x2="1"><stop stop-color="#66E2D0"/><stop offset=".46" stop-color="#9C9BFF"/><stop offset="1" stop-color="#FFC47B"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="170" rx="22" fill="url(#bg)"/>
<path d="M92 93H1108" stroke="#26334A" stroke-width="2"/>
<path d="M92 93H1108" stroke="url(#path)" stroke-width="2.5" opacity=".9"/>
<text x="38" y="35" fill="#9DA9C5" font-family="monospace" font-size="10" letter-spacing="2.5">A CONNECTED ENGINEERING PRACTICE</text>
<g font-family="Arial,Helvetica,sans-serif">
  <g transform="translate(120 93)"><circle r="16" fill="#10192B" stroke="#68E3D0" stroke-width="2"/><circle r="5" fill="#68E3D0" filter="url(#glow)"/><text x="0" y="40" fill="#EFF7FA" text-anchor="middle" font-size="12" font-weight="700">AI + DATA</text><text x="0" y="57" fill="#8998B0" text-anchor="middle" font-size="9">models · agents</text></g>
  <g transform="translate(440 93)"><circle r="16" fill="#10192B" stroke="#9C9BFF" stroke-width="2"/><circle r="5" fill="#9C9BFF" filter="url(#glow)"/><text x="0" y="40" fill="#EFF7FA" text-anchor="middle" font-size="12" font-weight="700">EVALUATION</text><text x="0" y="57" fill="#8998B0" text-anchor="middle" font-size="9">trust · safety</text></g>
  <g transform="translate(760 93)"><circle r="16" fill="#10192B" stroke="#70CFF0" stroke-width="2"/><circle r="5" fill="#70CFF0" filter="url(#glow)"/><text x="0" y="40" fill="#EFF7FA" text-anchor="middle" font-size="12" font-weight="700">PRODUCTS</text><text x="0" y="57" fill="#8998B0" text-anchor="middle" font-size="9">web · APIs · data</text></g>
  <g transform="translate(1080 93)"><circle r="16" fill="#10192B" stroke="#FFC47B" stroke-width="2"/><circle r="5" fill="#FFC47B" filter="url(#glow)"/><text x="0" y="40" fill="#EFF7FA" text-anchor="middle" font-size="12" font-weight="700">CLOUD</text><text x="0" y="57" fill="#8998B0" text-anchor="middle" font-size="9">ship · operate</text></g>
</g>
</svg>
