<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d"><title id="t">git-why local-first code reasoning</title><desc id="d">A local model reads a bounded Git diff and returns the reasoning behind the change.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#171527"/><stop offset="1" stop-color="#271A31"/></linearGradient><linearGradient id="a"><stop stop-color="#FFC47A"/><stop offset="1" stop-color="#FF82B8"/></linearGradient></defs><rect width="720" height="360" rx="22" fill="url(#b)"/><text x="34" y="45" fill="#FFC47A" font-family="monospace" font-size="11" letter-spacing="3">04 / LOCAL-FIRST DEVELOPER TOOL</text><text x="34" y="89" fill="#FFF8F1" font-family="Arial" font-size="25" font-weight="700">Ask the diff why.</text><g transform="translate(48 128)"><rect x="0" y="0" width="238" height="145" rx="13" fill="#120F20" stroke="#54405B"/><circle cx="18" cy="19" r="4" fill="#FF8DB7"/><circle cx="33" cy="19" r="4" fill="#FFC47A"/><circle cx="48" cy="19" r="4" fill="#7FE2B6"/><text x="18" y="51" fill="#A7A1B7" font-family="monospace" font-size="10">$ git diff HEAD~1..HEAD</text><text x="18" y="78" fill="#FF9ABA" font-family="monospace" font-size="11">- retry_count = 3</text><text x="18" y="101" fill="#8FE3B8" font-family="monospace" font-size="11">+ retry_count = 5</text><text x="18" y="127" fill="#777186" font-family="monospace" font-size="9">diff bounded · local only</text><path d="M238 72h58" stroke="#F0A4A4" stroke-width="2" stroke-dasharray="5 6"/><circle cx="267" cy="72" r="4" fill="#FFC47A"/><rect x="296" y="12" width="138" height="120" rx="18" fill="#2C2037" stroke="#9A617E"/><circle cx="365" cy="55" r="25" fill="#372541" stroke="#FFB175"/><path d="M353 58c2-12 22-12 24 0m-23 9h22" fill="none" stroke="url(#a)" stroke-width="3" stroke-linecap="round"/><text x="365" y="103" text-anchor="middle" fill="#F2D5D9" font-family="monospace" font-size="10">LOCAL MODEL</text><path d="M434 72h53" stroke="#E9A0AA" stroke-width="2" stroke-dasharray="5 6"/><path d="M515 29h117q14 0 14 14v59q0 14-14 14H515q-14 0-14-14V43q0-14 14-14" fill="#211C30" stroke="#67516E"/><text x="531" y="56" fill="#FFCB9A" font-family="monospace" font-size="10">THE WHY</text><text x="531" y="78" fill="#D6CCDF" font-family="Arial" font-size="10">Retries increased to</text><text x="531" y="95" fill="#D6CCDF" font-family="Arial" font-size="10">handle transient API</text><text x="531" y="112" fill="#D6CCDF" font-family="Arial" font-size="10">failures.</text></g><path d="M34 310h652" stroke="#51414E"/><text x="35" y="336" fill="#FFC47A" font-family="monospace" font-size="10" letter-spacing="2">OLLAMA · PYTHON · ZERO CLOUD CALLS</text><circle cx="666" cy="334" r="4" fill="#FFC47A"/></svg>
